<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drug Interaction Knowledge Graph</title>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f9fc;
    color: #222;
}

#header {
    background: white;
    padding: 15px 20px;
    border-bottom: 1px solid #ddd;
}

h2 {
    margin: 0 0 12px;
}

#controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
}

#search {
    width: 280px;
    padding: 9px 12px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 14px;
}

button {
    padding: 9px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #1976d2;
    color: white;
}

button:hover {
    background: #125ca5;
}

#reset {
    background: #555;
}

#status {
    margin-top: 10px;
    font-size: 13px;
    color: #555;
}

#legend {
    margin-top: 10px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 13px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

.dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    display: inline-block;
}

.major {
    background: #d32f2f;
}

.moderate {
    background: #f57c00;
}

.minor {
    background: #fbc02d;
}

.contra {
    background: #000;
}

.food {
    background: #81c784;
    border-radius: 2px;
}

#graph {
    height: 82vh;
    margin: 15px 20px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
}

#info {
    display: none;
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 330px;
    max-height: 350px;
    overflow-y: auto;

    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;

    padding: 15px;

    box-shadow: 0 4px 18px rgba(0,0,0,0.2);
}

#info h3 {
    margin-top: 0;
}

.interaction {
    padding: 9px 0;
    border-bottom: 1px solid #ddd;
}

.warning {
    background: #fff3cd;
    padding: 8px;
    border-radius: 5px;
    margin-top: 8px;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="header">

    <h2>Drug Interaction Knowledge Graph</h2>

    <div id="controls">

        <input
            id="search"
            placeholder="Search drug or food..."
        >

        <button onclick="searchNode()">
            Search
        </button>

        <button id="reset" onclick="resetGraph()">
            Reset
        </button>

    </div>

    <div id="status">
        Loading knowledge graph...
    </div>

    <div id="legend">

        <div class="legend-item">
            <span class="dot major"></span>
            Major
        </div>

        <div class="legend-item">
            <span class="dot moderate"></span>
            Moderate
        </div>

        <div class="legend-item">
            <span class="dot minor"></span>
            Minor
        </div>

        <div class="legend-item">
            <span class="dot contra"></span>
            Contraindicated
        </div>

        <div class="legend-item">
            <span class="dot food"></span>
            Food
        </div>

    </div>

</div>


<div id="graph"></div>


<div id="info">
    <h3 id="info-title"></h3>
    <div id="info-content"></div>
</div>


<script>

let data = null;
let network = null;


/* =====================================
   COLORS
===================================== */

const COLORS = {
    major: "#d32f2f",
    moderate: "#f57c00",
    minor: "#fbc02d",
    contraindicated: "#000000"
};


/* =====================================
   LOAD DATA
===================================== */

fetch("http://localhost:8000/graph")

.then(response => {

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    return response.json();

})

.then(graphData => {

    data = graphData;

    createOverview();

    document.getElementById("status").textContent =
        `${data.nodes.length} nodes • ${data.edges.length} interactions • Select or search a drug to view its interactions`;

})

.catch(error => {

    console.error(error);

    document.getElementById("status").textContent =
        "Unable to load graph. Make sure FastAPI is running.";

});


/* =====================================
   CREATE OVERVIEW
===================================== */

function createOverview() {

    const nodes = data.nodes.map(node => {

        const isFood = node.kind === "food";

        return {
            id: node.id,
            label: node.id,

            shape: isFood
                ? "box"
                : "dot",

            size: isFood
                ? 18
                : 18,

            color: isFood
                ? "#81c784"
                : "#64b5f6",

            font: {
                size: 13
            }
        };

    });


    /*
       IMPORTANT:

       No interaction edges are displayed
       in the overview.

       This prevents the 350-edge
       spaghetti graph.
    */

    const edges = [];


    network = new vis.Network(

        document.getElementById("graph"),

        {
            nodes: new vis.DataSet(nodes),
            edges: new vis.DataSet(edges)
        },

        {

            physics: {

                enabled: true,

                stabilization: {
                    enabled: true,
                    iterations: 500
                },

                solver: "forceAtlas2Based",

                forceAtlas2Based: {

                    gravitationalConstant: -80,

                    centralGravity: 0.01,

                    springLength: 180,

                    damping: 0.9,

                    avoidOverlap: 1

                }

            },

            interaction: {

                dragNodes: true,
                dragView: true,
                zoomView: true,

                navigationButtons: true,

                hover: true

            }

        }

    );


    network.once(
        "stabilizationIterationsDone",
        function() {

            network.setOptions({
                physics: false
            });

            network.fit();

        }
    );


    /*
       Clicking a node displays
       only its interactions.
    */

    network.on("click", function(params) {

        if (params.nodes.length === 0) {
            resetGraph();
            return;
        }

        focusNode(params.nodes[0]);

    });

}


/* =====================================
   SHOW SELECTED NODE INTERACTIONS
===================================== */

function focusNode(nodeId) {

    const connectedEdges =
        data.edges.filter(edge =>
            edge.source === nodeId ||
            edge.target === nodeId
        );


    const connectedNodes =
        new Set();

    connectedNodes.add(nodeId);


    connectedEdges.forEach(edge => {

        connectedNodes.add(edge.source);
        connectedNodes.add(edge.target);

    });


    /*
       Only show the selected drug
       and its connected nodes.
    */

    const nodes = data.nodes

        .filter(node =>
            connectedNodes.has(node.id)
        )

        .map(node => {

            const isFood =
                node.kind === "food";

            const selected =
                node.id === nodeId;

            return {

                id: node.id,

                label: node.id,

                shape:
                    isFood
                    ? "box"
                    : "dot",

                size:
                    selected
                    ? 28
                    : 19,

                color:
                    selected
                    ? "#1565c0"
                    : isFood
                    ? "#81c784"
                    : "#64b5f6",

                font: {
                    size:
                        selected
                        ? 16
                        : 13
                }

            };

        });


    /*
       Only selected drug's
       interactions are shown.
    */

    const edges =
        connectedEdges.map(
            (edge, index) => {

                return {

                    id: index,

                    from: edge.source,

                    to: edge.target,

                    color:
                        COLORS[
                            edge.severity
                        ] || "#999",

                    width:
                        edge.severity === "major"
                        ? 3
                        : 2,

                    dashes:
                        edge.type === "drug-food",

                    title:
                        makeTooltip(edge)

                };

            }
        );


    network.setData({

        nodes:
            new vis.DataSet(nodes),

        edges:
            new vis.DataSet(edges)

    });


    network.setOptions({

        physics: {

            enabled: true,

            stabilization: {
                enabled: true,
                iterations: 200
            },

            solver: "forceAtlas2Based",

            forceAtlas2Based: {

                gravitationalConstant: -50,

                centralGravity: 0.01,

                springLength: 180,

                damping: 0.9

            }

        }

    });


    network.once(
        "stabilizationIterationsDone",
        function() {

            network.setOptions({
                physics: false
            });

            network.fit({
                animation: {
                    duration: 400
                }
            });

        }
    );


    showInfo(
        nodeId,
        connectedEdges
    );

}


/* =====================================
   TOOLTIP
===================================== */

function makeTooltip(edge) {

    let text =
        edge.severity.toUpperCase();


    if (
        edge.details_status ===
        "ddinter_severity_only"
    ) {

        text +=
            "\nDDInter interaction detected." +
            "\nDetailed mechanism pending clinical curation.";

    } else {

        text +=
            "\n" +
            edge.mechanism;

    }


    if (edge.sources) {

        text +=
            "\n\nSource: " +
            edge.sources.join(", ");

    }


    return text;

}


/* =====================================
   INFORMATION PANEL
===================================== */

function showInfo(nodeId, edges) {

    const panel =
        document.getElementById("info");

    const title =
        document.getElementById("info-title");

    const content =
        document.getElementById("info-content");


    title.textContent = nodeId;


    if (edges.length === 0) {

        content.innerHTML =
            "<p>No interactions found.</p>";

        panel.style.display = "block";

        return;

    }


    /*
       Sort by severity.
    */

    const rank = {

        contraindicated: 0,
        major: 1,
        moderate: 2,
        minor: 3

    };


    edges.sort(
        (a, b) =>
            rank[a.severity] -
            rank[b.severity]
    );


    let html = "";


    html += `
        <p>
            <b>${edges.length}</b>
            interaction(s)
        </p>
    `;


    edges.forEach(edge => {

        const other =
            edge.source === nodeId
            ? edge.target
            : edge.source;


        const sources =
            edge.sources
            ? edge.sources.join(", ")
            : "Unknown";


        const ddinterOnly =
            edge.details_status ===
            "ddinter_severity_only";


        html += `

            <div class="interaction">

                <b>${other}</b>

                <br>

                <span
                    style="
                        color:
                        ${COLORS[edge.severity]};
                        font-weight:bold;
                    "
                >
                    ${edge.severity}
                </span>

                <br>

                <small>
                    Source: ${sources}
                </small>

        `;


        if (ddinterOnly) {

            html += `

                <div class="warning">

                    Interaction detected by DDInter.

                    Detailed mechanism has not
                    been clinically curated
                    in this dataset.

                </div>

            `;

        } else {

            html += `

                <p>
                    ${edge.mechanism}
                </p>

            `;

        }


        html += `

            </div>

        `;

    });


    content.innerHTML = html;

    panel.style.display = "block";

}


/* =====================================
   SEARCH
===================================== */

function searchNode() {

    const query =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    if (!query) {
        return;
    }


    const node =
        data.nodes.find(
            n =>
                n.id
                    .toLowerCase()
                    .includes(query)
        );


    if (!node) {

        alert(
            "Drug or food not found."
        );

        return;

    }


    focusNode(node.id);

}


/* =====================================
   ENTER KEY
===================================== */

document
    .getElementById("search")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchNode();

            }

        }
    );


/* =====================================
   RESET
===================================== */

function resetGraph() {

    if (!data) {
        return;
    }


    document
        .getElementById("info")
        .style.display = "none";


    document
        .getElementById("search")
        .value = "";


    createOverview();

}

</script>

</body>
</html>
